services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: viora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: viora_bills
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viora -d viora_bills"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://viora:${POSTGRES_PASSWORD}@db:5432/viora_bills?schema=public
    depends_on:
      db: { condition: service_healthy }
  api:
    build: { context: ., target: api }
    environment:
      NODE_ENV: ${APP_ENV:-development}
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      TRUST_PROXY_HOPS: 1
      DATABASE_URL: postgresql://viora:${POSTGRES_PASSWORD}@db:5432/viora_bills?schema=public
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build: { context: ., target: web }
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres-data:
